<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subagent HUD Gallery — 100 Prototypes</title>
<style>
:root {
  --bg: #0a0a0f;
  --bg-card: #12121a;
  --bg-elevated: #1a1a25;
  --text: #e8e8f0;
  --text-dim: #888899;
  --text-muted: #555566;
  --cyan: #00d4ff;
  --purple: #a855f7;
  --orange: #ff8c42;
  --red: #ff4757;
  --green: #10b981;
  --blue: #3b82f6;
  --pink: #ec4899;
  --yellow: #f59e0b;
  --glass: rgba(255,255,255,0.05);
  --glass-border: rgba(255,255,255,0.1);
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 48px rgba(0,0,0,0.6);
  --radius: 8px;
  --radius-lg: 16px;
  --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:100;background:rgba(10,10,15,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);padding:20px 32px;text-align:center}
header h1{font-size:20px;font-weight:600;letter-spacing:-0.02em;margin-bottom:6px}
header p{font-size:13px;color:var(--text-dim)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px;padding:32px;max-width:1800px;margin:0 auto}
.prototype{background:var(--bg-card);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:20px;transition:all var(--transition);position:relative;overflow:hidden}
.prototype:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:rgba(255,255,255,0.2)}
.prototype-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.prototype-number{font-size:11px;font-weight:700;color:var(--text-muted);font-family:'SF Mono','Monaco','Consolas',monospace;letter-spacing:0.05em}
.prototype-name{font-size:14px;font-weight:500;color:var(--text);flex:1}
.preview{height:120px;background:var(--bg-elevated);border-radius:var(--radius);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:12px}
.bottom-bar{width:100%;height:32px;background:var(--glass);border-radius:6px;display:flex;align-items:center;justify-content:space-around;padding:0 12px;position:relative;transition:all var(--transition)}
.agent{width:8px;height:8px;border-radius:50%;position:relative;transition:all var(--transition)}
.agent-1{background:var(--cyan)}.agent-2{background:var(--purple)}.agent-3{background:var(--orange)}

/* 001 Glass Fade */
.s001 .bottom-bar{background:linear-gradient(135deg,rgba(0,212,255,0.1),rgba(168,85,247,0.1));backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.15)}
.s001:hover .agent{transform:scale(1.3)}
.s001:hover .agent-1{box-shadow:0 0 12px var(--cyan)}
.s001:hover .agent-2{box-shadow:0 0 12px var(--purple)}
.s001:hover .agent-3{box-shadow:0 0 12px var(--orange)}

/* 002 Arc Slide */
.s002 .bottom-bar{border-radius:16px 16px 6px 6px;background:rgba(255,255,255,0.08)}
.s002 .agent{transform:translateY(20px);opacity:0}
.s002:hover .agent{transform:translateY(0);opacity:1}
.s002:hover .agent-1{transition-delay:.05s}.s002:hover .agent-2{transition-delay:.1s}.s002:hover .agent-3{transition-delay:.15s}

/* 003 Pill Rail */
.s003 .bottom-bar{height:28px;border-radius:14px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1)}
.s003 .agent{width:24px;height:6px;border-radius:3px}
.s003:hover .agent{width:32px}

/* 004 Magnetic Dots */
.s004 .agent{width:10px;height:10px;transition:all .4s cubic-bezier(.68,-.55,.265,1.55)}
.s004:hover .agent-1{transform:translate(-4px,-4px)}.s004:hover .agent-2{transform:translateY(-6px)}.s004:hover .agent-3{transform:translate(4px,-4px)}

/* 005 Orbit */
.s005 .bottom-bar{background:radial-gradient(circle at center,rgba(168,85,247,0.15),transparent)}
.s005 .agent{animation:orbit005 3s linear infinite paused}
.s005:hover .agent{animation-play-state:running}
@keyframes orbit005{0%{transform:rotate(0deg) translateX(8px) rotate(0deg)}100%{transform:rotate(360deg) translateX(8px) rotate(-360deg)}}

/* 006 Timeline */
.s006 .bottom-bar{height:4px;background:rgba(255,255,255,0.1);border-radius:2px}
.s006 .agent{width:12px;height:12px;position:absolute;top:-4px}
.s006 .agent-1{left:20%}.s006 .agent-2{left:50%}.s006 .agent-3{left:80%}
.s006:hover .agent{transform:scale(1.4)}

/* 007 Ribbon */
.s007 .bottom-bar{background:linear-gradient(90deg,var(--cyan),var(--purple),var(--orange));height:3px;border-radius:2px;transform:scaleX(0);transition:transform .5s ease}
.s007:hover .bottom-bar{transform:scaleX(1)}
.s007 .agent{opacity:0}.s007:hover .agent{opacity:1;transition-delay:.3s}

/* 008 Drawer */
.s008 .bottom-bar{transform:translateY(100%);transition:transform .4s cubic-bezier(.4,0,.2,1)}
.s008:hover .bottom-bar{transform:translateY(0)}

/* 009 Stack */
.s009 .bottom-bar{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08)}
.s009 .agent{width:20px;height:4px;border-radius:2px;transform:translateY(10px);opacity:0}
.s009:hover .agent{transform:translateY(0);opacity:1}
.s009:hover .agent-1{transition-delay:.05s}.s009:hover .agent-2{transition-delay:.1s}.s009:hover .agent-3{transition-delay:.15s}

/* 010 Wave */
.s010 .agent{animation:wave010 1.5s ease-in-out infinite paused}
.s010:hover .agent{animation-play-state:running}
@keyframes wave010{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.s010 .agent-2{animation-delay:.15s}.s010 .agent-3{animation-delay:.3s}

/* 011 Spotlight */
.s011 .bottom-bar{background:radial-gradient(circle at 50% 50%,rgba(0,212,255,0.2),transparent 70%)}
.s011 .agent{opacity:.3;transition:all .4s ease}
.s011:hover .agent{opacity:1;box-shadow:0 0 20px currentColor}

/* 012 Neon */
.s012 .bottom-bar{background:rgba(0,0,0,0.6);border:1px solid rgba(0,212,255,0.3);box-shadow:0 0 10px rgba(0,212,255,0.2)}
.s012 .agent{box-shadow:0 0 8px currentColor}
.s012:hover .agent{box-shadow:0 0 16px currentColor,0 0 24px currentColor}

/* 013 Minimal */
.s013 .bottom-bar{background:transparent;border-bottom:1px solid rgba(255,255,255,0.1)}
.s013 .agent{width:4px;height:4px;opacity:.5}.s013:hover .agent{opacity:1}

/* 014 Liquid */
.s014 .bottom-bar{background:linear-gradient(135deg,rgba(0,212,255,0.15),rgba(168,85,247,0.15));border-radius:20px;animation:liquid014 3s ease-in-out infinite paused}
.s014:hover .bottom-bar{animation-play-state:running}
@keyframes liquid014{0%,100%{border-radius:20px}50%{border-radius:10px 30px 10px 30px}}

/* 015 Paper */
.s015 .bottom-bar{background:#1a1a1a;border:1px solid #333;box-shadow:2px 2px 0 rgba(0,0,0,0.5)}
.s015 .agent{border-radius:2px}

/* 016 Command Palette */
.s016 .bottom-bar{background:rgba(20,20,30,0.95);border:1px solid rgba(255,255,255,0.15);border-radius:8px;backdrop-filter:blur(20px)}
.s016 .agent{width:6px;height:6px}

/* 017 Terminal */
.s017 .bottom-bar{background:#000;border:1px solid #333}
.s017 .agent{width:6px;height:6px;border-radius:0}

/* 018 Constellation */
.s018 .bottom-bar{background:radial-gradient(circle at 20% 50%,rgba(0,212,255,0.1),transparent 40%),radial-gradient(circle at 80% 50%,rgba(168,85,247,0.1),transparent 40%)}
.s018 .agent{width:4px;height:4px;box-shadow:0 0 8px currentColor}
.s018:hover .agent{animation:twinkle018 2s ease-in-out infinite}
@keyframes twinkle018{0%,100%{opacity:1}50%{opacity:.3}}

/* 019 Ticker */
.s019 .bottom-bar{overflow:hidden}
.s019 .agent{animation:ticker019 2s linear infinite paused}
.s019:hover .agent{animation-play-state:running}
@keyframes ticker019{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.s019 .agent-2{animation-delay:.3s}.s019 .agent-3{animation-delay:.6s}

/* 020 Radial */
.s020 .bottom-bar{background:conic-gradient(from 0deg,transparent,rgba(0,212,255,0.2),transparent);animation:radial020 4s linear infinite paused}
.s020:hover .bottom-bar{animation-play-state:running}
@keyframes radial020{100%{transform:rotate(360deg)}}

/* 021 Badge Cluster */
.s021 .bottom-bar{background:transparent}
.s021 .agent{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:rgba(255,255,255,0.9)}
.s021:hover .agent{transform:scale(1.1)}

/* 022 Glass Morph */
.s022 .bottom-bar{background:rgba(255,255,255,0.08);backdrop-filter:blur(16px) saturate(180%);border:1px solid rgba(255,255,255,0.18)}

/* 023 Gradient Border */
.s023 .bottom-bar{background:var(--bg-elevated);border:2px solid transparent;position:relative}
.s023 .bottom-bar::before{content:'';position:absolute;inset:-2px;background:linear-gradient(135deg,var(--cyan),var(--purple));border-radius:8px;z-index:-1;opacity:0;transition:opacity .3s}
.s023:hover .bottom-bar::before{opacity:1}

/* 024 Pulse */
.s024 .agent{animation:pulse024 2s ease-in-out infinite paused}
.s024:hover .agent{animation-play-state:running}
@keyframes pulse024{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.7}}

/* 025 Slide Up */
.s025 .bottom-bar{transform:translateY(100%);opacity:0;transition:all .4s cubic-bezier(.4,0,.2,1)}
.s025:hover .bottom-bar{transform:translateY(0);opacity:1}

/* 026 Fade In */
.s026 .bottom-bar{opacity:0;transition:opacity .5s ease}.s026:hover .bottom-bar{opacity:1}

/* 027 Scale In */
.s027 .bottom-bar{transform:scale(.8);opacity:0;transition:all .4s cubic-bezier(.34,1.56,.64,1)}
.s027:hover .bottom-bar{transform:scale(1);opacity:1}

/* 028 Rotate In */
.s028 .bottom-bar{transform:rotate(-10deg) scale(.9);opacity:0;transition:all .5s cubic-bezier(.4,0,.2,1)}
.s028:hover .bottom-bar{transform:rotate(0) scale(1);opacity:1}

/* 029 Bounce */
.s029 .agent{animation:bounce029 .6s ease-in-out infinite paused}
.s029:hover .agent{animation-play-state:running}
@keyframes bounce029{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.s029 .agent-2{animation-delay:.1s}.s029 .agent-3{animation-delay:.2s}

/* 030 Shake */
.s030:hover .agent{animation:shake030 .5s ease-in-out}
@keyframes shake030{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* 031 Glow */
.s031 .agent{transition:all .4s ease}
.s031:hover .agent{box-shadow:0 0 20px currentColor,0 0 40px currentColor}

/* 032 Expand */
.s032 .bottom-bar{width:60%;margin:0 auto;transition:width .4s ease}.s032:hover .bottom-bar{width:100%}

/* 033 Contract */
.s033 .bottom-bar{width:100%;transition:width .4s ease}.s033:hover .bottom-bar{width:70%;margin:0 auto}

/* 034 Split */
.s034 .bottom-bar{background:linear-gradient(90deg,transparent 50%,rgba(255,255,255,0.1) 50%)}
.s034 .agent-1{transform:translateX(-20px);opacity:0}.s034 .agent-3{transform:translateX(20px);opacity:0}
.s034:hover .agent{transform:translateX(0);opacity:1;transition:all .4s}

/* 035 Merge */
.s035 .agent-1{transform:translateX(-30px)}.s035 .agent-3{transform:translateX(30px)}
.s035:hover .agent{transform:translateX(0);transition:all .5s cubic-bezier(.4,0,.2,1)}

/* 036 Float */
.s036 .agent{animation:float036 3s ease-in-out infinite paused}
.s036:hover .agent{animation-play-state:running}
@keyframes float036{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-6px) rotate(5deg)}}

/* 037 Spin */
.s037 .agent{transition:transform .6s cubic-bezier(.4,0,.2,1)}.s037:hover .agent{transform:rotate(360deg)}

/* 038 Flip */
.s038 .agent{transition:transform .6s;transform-style:preserve-3d}.s038:hover .agent{transform:rotateY(180deg)}

/* 039 Skew */
.s039 .bottom-bar{transition:transform .4s}.s039:hover .bottom-bar{transform:skewX(-5deg)}

/* 040 Blur */
.s040 .bottom-bar{filter:blur(8px);transition:filter .4s}.s040:hover .bottom-bar{filter:blur(0)}

/* 041 Brightness */
.s041 .bottom-bar{filter:brightness(.3);transition:filter .4s}.s041:hover .bottom-bar{filter:brightness(1)}

/* 042 Saturate */
.s042 .bottom-bar{filter:saturate(0);transition:filter .4s}.s042:hover .bottom-bar{filter:saturate(2)}

/* 043 Contrast */
.s043 .bottom-bar{filter:contrast(.3);transition:filter .4s}.s043:hover .bottom-bar{filter:contrast(1)}

/* 044 Invert */
.s044 .bottom-bar{filter:invert(1);transition:filter .4s}.s044:hover .bottom-bar{filter:invert(0)}

/* 045 Drop Shadow */
.s045 .bottom-bar{filter:drop-shadow(0 0 0 rgba(0,212,255,0));transition:filter .4s}
.s045:hover .bottom-bar{filter:drop-shadow(0 4px 12px rgba(0,212,255,0.5))}

/* 046 Opacity Cascade */
.s046 .agent{opacity:0}
.s046:hover .agent-1{opacity:1;transition-delay:0s}.s046:hover .agent-2{opacity:1;transition-delay:.1s}.s046:hover .agent-3{opacity:1;transition-delay:.2s}

/* 047 Color Shift */
.s047 .agent{transition:all .4s}
.s047:hover .agent-1{background:var(--green)}.s047:hover .agent-2{background:var(--blue)}.s047:hover .agent-3{background:var(--pink)}

/* 048 Size Morph */
.s048 .agent{transition:all .4s cubic-bezier(.68,-.55,.265,1.55)}
.s048:hover .agent-1{width:16px;height:16px}.s048:hover .agent-2{width:12px;height:12px}.s048:hover .agent-3{width:20px;height:20px}

/* 049 Scatter */
.s049 .agent{transition:all .5s cubic-bezier(.4,0,.2,1)}
.s049:hover .agent-1{transform:translate(-8px,-8px)}.s049:hover .agent-2{transform:translateY(-12px)}.s049:hover .agent-3{transform:translate(8px,-8px)}

/* 050 Elastic */
.s050 .agent{transition:transform .6s cubic-bezier(.68,-.55,.265,1.55)}.s050:hover .agent{transform:scale(1.5)}

/* 051 Spring */
.s051 .agent{transition:transform .5s cubic-bezier(.34,1.56,.64,1)}.s051:hover .agent{transform:translateY(-10px)}

/* 052 Gravity */
.s052 .agent{transition:transform .6s cubic-bezier(.55,.085,.68,.53)}.s052:hover .agent{transform:translateY(8px)}

/* 053 Friction */
.s053 .agent{transition:transform .8s cubic-bezier(.25,.46,.45,.94)}.s053:hover .agent{transform:scale(1.2)}

/* 054 Momentum */
.s054 .agent{transition:transform .7s cubic-bezier(.075,.82,.165,1)}.s054:hover .agent{transform:translateX(6px)}

/* 055 Stagger Fade */
.s055 .agent{opacity:0;transition:opacity .4s}
.s055:hover .agent-1{opacity:1;transition-delay:0s}.s055:hover .agent-2{opacity:1;transition-delay:.15s}.s055:hover .agent-3{opacity:1;transition-delay:.3s}

/* 056 Stagger Slide */
.s056 .agent{transform:translateY(20px);opacity:0;transition:all .4s}
.s056:hover .agent-1{transform:translateY(0);opacity:1;transition-delay:0s}
.s056:hover .agent-2{transform:translateY(0);opacity:1;transition-delay:.1s}
.s056:hover .agent-3{transform:translateY(0);opacity:1;transition-delay:.2s}

/* 057 Stagger Scale */
.s057 .agent{transform:scale(0);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.s057:hover .agent-1{transform:scale(1);transition-delay:0s}.s057:hover .agent-2{transform:scale(1);transition-delay:.1s}.s057:hover .agent-3{transform:scale(1);transition-delay:.2s}

/* 058 Ripple */
.s058 .bottom-bar{position:relative;overflow:hidden}
.s058 .bottom-bar::after{content:'';position:absolute;width:100%;height:100%;background:radial-gradient(circle,rgba(0,212,255,0.3),transparent 70%);transform:scale(0);transition:transform .6s}
.s058:hover .bottom-bar::after{transform:scale(2)}

/* 059 Shimmer */
.s059 .bottom-bar{background:linear-gradient(90deg,rgba(255,255,255,0.05) 0%,rgba(255,255,255,0.1) 50%,rgba(255,255,255,0.05) 100%);background-size:200% 100%;animation:shimmer059 2s linear infinite paused}
.s059:hover .bottom-bar{animation-play-state:running}
@keyframes shimmer059{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* 060 Glitch */
.s060:hover .bottom-bar{animation:glitch060 .3s linear}
@keyframes glitch060{0%,100%{transform:translate(0)}20%{transform:translate(-2px,2px)}40%{transform:translate(-2px,-2px)}60%{transform:translate(2px,2px)}80%{transform:translate(2px,-2px)}}

/* 061 Matrix */
.s061 .bottom-bar{background:#000;border:1px solid #0f0;box-shadow:0 0 10px rgba(0,255,0,0.3)}
.s061 .agent{background:#0f0;box-shadow:0 0 8px #0f0}

/* 062 Vaporwave */
.s062 .bottom-bar{background:linear-gradient(135deg,#ff006e,#8338ec,#3a86ff);height:4px}
.s062 .agent{width:12px;height:12px;border-radius:2px}

/* 063 Retro */
.s063 .bottom-bar{background:#2d2d2d;border:2px solid #555;border-radius:0}
.s063 .agent{border-radius:0;width:10px;height:10px}

/* 064 Futuristic */
.s064 .bottom-bar{background:linear-gradient(90deg,rgba(0,212,255,0.2),rgba(168,85,247,0.2));border:1px solid rgba(0,212,255,0.4);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}

/* 065 Organic */
.s065 .bottom-bar{border-radius:50% 50% 20px 20px / 60% 60% 20px 20px;background:rgba(16,185,129,0.15)}

/* 066 Geometric */
.s066 .bottom-bar{background:transparent;border:2px solid rgba(255,255,255,0.2);clip-path:polygon(0 20%,20% 0,80% 0,100% 20%,100% 80%,80% 100%,20% 100%,0 80%)}

/* 067 Asymmetric */
.s067 .bottom-bar{border-radius:20px 5px 20px 5px;background:rgba(255,140,66,0.15)}

/* 068 Layered */
.s068 .bottom-bar{background:rgba(255,255,255,0.05);box-shadow:0 2px 0 rgba(255,255,255,0.03),0 4px 0 rgba(255,255,255,0.02),0 6px 0 rgba(255,255,255,0.01)}

/* 069 Floating */
.s069 .bottom-bar{background:rgba(255,255,255,0.08);box-shadow:0 8px 32px rgba(0,0,0,0.3);transform:translateY(4px);transition:transform .4s}
.s069:hover .bottom-bar{transform:translateY(0)}

/* 070 Sunken */
.s070 .bottom-bar{background:rgba(0,0,0,0.4);box-shadow:inset 0 2px 8px rgba(0,0,0,0.5)}

/* 071 Raised */
.s071 .bottom-bar{background:rgba(255,255,255,0.1);box-shadow:0 4px 16px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.1)}

/* 072 Inset */
.s072 .bottom-bar{background:rgba(0,0,0,0.3);box-shadow:inset 0 2px 4px rgba(0,0,0,0.6),inset 0 -1px 0 rgba(255,255,255,0.05)}

/* 073 Outlined */
.s073 .bottom-bar{background:transparent;border:2px solid rgba(0,212,255,0.4)}.s073:hover .bottom-bar{border-color:var(--cyan)}

/* 074 Dashed */
.s074 .bottom-bar{background:transparent;border:2px dashed rgba(255,255,255,0.2)}.s074:hover .bottom-bar{border-color:rgba(255,255,255,0.5)}

/* 075 Dotted */
.s075 .bottom-bar{background:transparent;border:2px dotted rgba(168,85,247,0.3)}.s075:hover .bottom-bar{border-color:var(--purple)}

/* 076 Double */
.s076 .bottom-bar{background:transparent;border:3px double rgba(255,140,66,0.4)}.s076:hover .bottom-bar{border-color:var(--orange)}

/* 077 Gradient Fill */
.s077 .bottom-bar{background:linear-gradient(135deg,var(--cyan),var(--purple));opacity:.3;transition:opacity .4s}.s077:hover .bottom-bar{opacity:.7}

/* 078 Mesh */
.s078 .bottom-bar{background:linear-gradient(45deg,rgba(0,212,255,0.1) 25%,transparent 25%),linear-gradient(-45deg,rgba(168,85,247,0.1) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,rgba(255,140,66,0.1) 75%),linear-gradient(-45deg,transparent 75%,rgba(16,185,129,0.1) 75%);background-size:20px 20px}

/* 079 Scanlines */
.s079 .bottom-bar{background:repeating-linear-gradient(0deg,rgba(255,255,255,0.05),rgba(255,255,255,0.05) 1px,transparent 1px,transparent 2px)}

/* 080 Grid */
.s080 .bottom-bar{background-image:linear-gradient(rgba(255,255,255,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.05) 1px,transparent 1px);background-size:10px 10px}

/* 081 Diagonal */
.s081 .bottom-bar{background:repeating-linear-gradient(45deg,rgba(0,212,255,0.1),rgba(0,212,255,0.1) 2px,transparent 2px,transparent 10px)}

/* 082 Striped */
.s082 .bottom-bar{background:repeating-linear-gradient(90deg,rgba(168,85,247,0.15),rgba(168,85,247,0.15) 4px,transparent 4px,transparent 8px)}

/* 083 Polka */
.s083 .bottom-bar{background-image:radial-gradient(circle,rgba(255,140,66,0.2) 2px,transparent 2px);background-size:12px 12px}

/* 084 Chevron */
.s084 .bottom-bar{background:linear-gradient(135deg,rgba(0,212,255,0.15) 25%,transparent 25%) -10px 0,linear-gradient(225deg,rgba(0,212,255,0.15) 25%,transparent 25%) -10px 0,linear-gradient(315deg,rgba(0,212,255,0.15) 25%,transparent 25%),linear-gradient(45deg,rgba(0,212,255,0.15) 25%,transparent 25%);background-size:20px 20px}

/* 085 Zigzag */
