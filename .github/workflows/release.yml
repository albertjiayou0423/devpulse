name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.2.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Build app
        run: |
          swiftc -O Sources/OpenCodeMonitor/main.swift -o DevPulse \
            -Xlinker -lsqlite3 -framework Cocoa -framework ServiceManagement
          
          # Create app bundle structure
          mkdir -p DevPulse.app/Contents/MacOS
          mkdir -p DevPulse.app/Contents/Resources
          
          # Copy binary
          cp DevPulse DevPulse.app/Contents/MacOS/DevPulse
          
          # Create Info.plist
          cat > DevPulse.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>DevPulse</string>
              <key>CFBundleIdentifier</key>
              <string>com.devpulse.app</string>
              <key>CFBundleName</key>
              <string>DevPulse</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>LSUIElement</key>
              <true/>
          </dict>
          </plist>
          EOF
      
      - name: Install create-dmg
        run: brew install create-dmg
        
      - name: Create DMG
        run: |
          create-dmg \
            --volname "DevPulse" \
            --background "assets/dmg-background.png" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "DevPulse.app" 165 200 \
            --hide-extension "DevPulse.app" \
            --app-drop-link 495 200 \
            "DevPulse.dmg" \
            "DevPulse.app"
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: DevPulse.dmg
          name: DevPulse ${{ inputs.version }}
          tag_name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          body: |
            ## DevPulse ${{ inputs.version }}
            
            ${{ inputs.prerelease && '🚧 Pre-release build' || '✅ Stable release' }}
            
            ### Installation
            
            1. Download `DevPulse.dmg`
            2. Open and drag to Applications
            3. Launch from Applications
            
            ### Requirements
            
            - macOS 14.0+
            - [opencode](https://github.com/opencode-ai/opencode) installed
            
            ---
            Built from commit ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
